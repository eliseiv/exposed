# Deploy to the shared server (external Traefik in /opt/edge) over SSH.
#
# Trigger: every push to `main` — but only AFTER the `ci` workflow for that push concluded
# `success` (`workflow_run`), so a red build never reaches production. Manual redeploy of the
# current main: Actions → deploy → Run workflow.
#
# On the server (/opt/exposed): fetch → fast-forward to the TESTED commit → build → migrate →
# up → readiness gate on the api container health → public smoke GET https://<domain>/healthz.
# Traefik is never touched: routing comes from the api container labels.
#
# GitHub Secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY.
# Optional Variable DEPLOY_INSTANCES (`dir:project`, space-separated) — default `exposed:exposed`.

name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: ssh deploy (shared server + Traefik)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    env:
      HAS_SSH: ${{ secrets.SSH_HOST != '' && secrets.SSH_PRIVATE_KEY != '' }}
    steps:
      - name: Secrets not configured yet
        if: env.HAS_SSH != 'true'
        run: echo "::warning title=Deploy skipped::set SSH_HOST, SSH_USER, SSH_PRIVATE_KEY secrets"

      - name: Deploy over SSH
        if: env.HAS_SSH == 'true'
        # PINNED BY COMMIT SHA: this action receives the production SSH key; a mutable tag could be
        # re-pointed by a compromised upstream and leak it.
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17  # v1.2.0
        env:
          DEPLOY_INSTANCES: ${{ vars.DEPLOY_INSTANCES || 'exposed:exposed' }}
          # The commit CI tested (workflow_run) or the current main (manual run).
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_INSTANCES,DEPLOY_SHA
          command_timeout: 30m
          # script_stop MUST stay false: `true` injects `set -e`, which would abort on the first
          # non-zero command. Failures are caught by explicit checks and the final `exit 1`.
          script_stop: false
          script: |
            set -uo pipefail
            FAILED=""
            for entry in $DEPLOY_INSTANCES; do
              dir="${entry%%:*}"; proj="${entry##*:}"
              echo "[deploy] === /opt/$dir (project $proj) @ $DEPLOY_SHA ==="
              cd "/opt/$dir" || { echo "::error::/opt/$dir missing"; FAILED="$FAILED $proj"; continue; }
              compose="docker compose -p $proj -f docker-compose.prod.yml --env-file .env"

              if ! { git fetch --prune origin && git checkout -q main && git merge --ff-only "$DEPLOY_SHA"; }; then
                echo "::error title=git failed ($proj)::cannot fast-forward /opt/$dir to $DEPLOY_SHA"
                FAILED="$FAILED $proj"; continue
              fi
              if ! $compose build api migrate; then
                echo "::error title=build failed ($proj)::docker compose build returned non-zero"
                FAILED="$FAILED $proj"; continue
              fi
              if ! $compose run --rm migrate; then
                echo "::error title=migrate failed ($proj)::alembic upgrade head returned non-zero"
                FAILED="$FAILED $proj"; continue
              fi
              # `up` can return a transient non-zero while api is fine — the health gate decides.
              up_rc=0; $compose up -d --no-build || up_rc=$?
              echo "[deploy:$proj] up rc=$up_rc (informational)"

              ready=0
              for i in $(seq 1 30); do
                h="$(docker inspect "${proj}-api-1" --format '{{.State.Health.Status}}' 2>/dev/null || echo none)"
                if [ "$h" = "healthy" ]; then ready=1; break; fi
                echo "[deploy:$proj] api health=$h ($i/30)"; sleep 2
              done
              if [ "$ready" -ne 1 ]; then
                echo "::error title=api not healthy ($proj)::api did not become healthy within ~60s"
                docker logs "${proj}-api-1" --tail 40 2>&1 || true
                FAILED="$FAILED $proj"; continue
              fi

              domain="$(grep -E '^SERVICE_DOMAIN=' .env | head -n1 | cut -d= -f2- | tr -d '"'"'"' ')"
              if [ -n "$domain" ]; then
                ok=0
                for i in $(seq 1 12); do
                  if curl -fsS --max-time 5 "https://$domain/healthz" >/dev/null; then ok=1; break; fi
                  sleep 5
                done
                [ "$ok" -eq 1 ] && echo "[smoke:$proj] https://$domain/healthz OK" \
                  || echo "::warning title=smoke ($proj)::https://$domain/healthz not 200 within 60s"
              fi
            done
            docker image prune -f >/dev/null 2>&1 || true
            if [ -n "$FAILED" ]; then echo "::error title=Deploy failed::$FAILED"; exit 1; fi
            echo "[deploy] done"
